name: Windows Release

on:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'
          cache-dependency-path: |
            windows/core/go.sum
            tunnel/go.sum

      - name: Build Windows packages
        shell: powershell
        run: .\windows\build.ps1

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          name: BlockAds for Windows v1.4.0
          body: |
            Windows v1.4.0 syncs the shared engine and filter catalog with upstream Android v6.8.0.

            - Verifies local IPv4/IPv6 UDP/TCP DNS filtering before reporting protection.
            - Reconnects after DNS service failure when auto reconnect is enabled.
            - Refreshes active filter lists without overwriting mapped files.
            - Stores saved data outside the installer directory for future upgrades.
            - Preserves normal network routes for games and other applications.

            When upgrading from v1.3.1 or older, back up %LOCALAPPDATA%/BlockAds first,
            or launch the new portable app once before running the installer to migrate saved data.

            DNS filtering blocks ad and tracker domains. Same-host ads and custom browser DNS may bypass it.
          files: |
            windows/dist/BlockAds-Windows-Setup-v1.4.0.exe
            windows/dist/BlockAds-Windows-Portable-v1.4.0.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
