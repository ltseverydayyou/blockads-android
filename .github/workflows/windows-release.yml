name: Windows Release

on:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'

      - name: Build Windows packages
        shell: powershell
        run: .\windows\build.ps1

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          name: BlockAds for Windows v1.1
          body: |
            Windows v1.1 fixes DNS interception and ad blocking without overwriting the physical adapter's DNS settings.

            - System Default now resolves and uses the active physical adapter's real DNS servers, matching the Android path instead of treating 0.0.0.0 as an upstream resolver.
            - DNS queries are captured through the BlockAds Wintun adapter with an NRPT rule while the Wi-Fi/Ethernet DNS configuration remains untouched.
            - Legacy DNS-takeover settings are restored before startup and the stale 0.0.0.0 sentinel is migrated away.
            - Cloudflare and other explicit DNS providers use matching primary/fallback resolvers without contaminating System Default.
            - Plain DNS now handles IPv4 and IPv6 upstream addresses correctly.
            - Enabled compiled filters are loaded through the same Go filtering engine used by Android.
          files: |
            windows/dist/BlockAds-Windows-Setup-v1.1.exe
            windows/dist/BlockAds-Windows-Portable-v1.1.zip
          draft: false
          prerelease: false
