name: Windows Release

on:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'
          cache-dependency-path: |
            windows/core/go.sum
            tunnel/go.sum

      - name: Build Windows packages
        shell: powershell
        run: .\windows\build.ps1

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          name: BlockAds for Windows v1.3
          body: |
            Windows v1.3 makes BlockAds behave properly as a Windows app.

            - Adds a system tray icon with quick on/off controls.
            - Adds a taskbar right-click toggle.
            - Remembers whether protection was enabled after a restart.
            - Fixes the UAC startup race that could reset settings.
            - Prompts when a newer Windows release is available.
          files: |
            windows/dist/BlockAds-Windows-Setup-v1.3.exe
            windows/dist/BlockAds-Windows-Portable-v1.3.zip
          draft: false
          prerelease: false
