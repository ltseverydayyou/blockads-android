name: Windows Release

on:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'
          cache-dependency-path: |
            windows/core/go.sum
            tunnel/go.sum

      - name: Build Windows packages
        shell: powershell
        run: .\windows\build.ps1

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          name: BlockAds for Windows v1.2
          body: |
            Windows v1.2 fixes EasyList DNS false positives that could globally block legitimate Cloudflare Workers and other shared hosting domains.

            - Contextual Adblock/EasyList rules with $domain, $third-party, resource-type, or other request modifiers are no longer compiled into global DNS blocks.
            - Plain-domain parsing now validates real DNS hostnames instead of accepting arbitrary one-token filter syntax.
            - Existing built-in trie/bloom files are automatically rebuilt once with DNS compiler v2 from their original filter URLs.
            - Built-in filters then reuse the safe local compiled trie until their next update.
            - Custom lists always rebuild trie/bloom locally with the DNS-safe compiler even when backend cosmetic/scriptlet assets are available.
            - Fixes the EasyList rule ||workers.dev^$domain=chessgames.com|player.vidzee.wtf being incorrectly converted into a global workers.dev block.
            - Keeps context-free blocked Worker hostnames blocked while allowing unrelated workers.dev deployments.
            - Includes the Windows DNS, Cloudflare upstream, startup registration, and shutdown/crash cleanup fixes from v1.1.
          files: |
            windows/dist/BlockAds-Windows-Setup-v1.2.exe
            windows/dist/BlockAds-Windows-Portable-v1.2.zip
          draft: false
          prerelease: false
